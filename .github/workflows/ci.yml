name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

# Menor privilegio: o CI so le o repositorio.
permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validacoes:
    name: Validacoes (nomes do compose e gateway por ambiente)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - name: Validar o compose
        run: |
          ambiente=staging
          [ "${{ github.base_ref || github.ref_name }}" = "main" ] && ambiente=production
          python3 .github/scripts/validate-compose.py --repo "${{ github.event.repository.name }}" --env "$ambiente" \
            --exceptions .github/compose-exceptions.txt docker-compose-stage.yml

  backend:
    name: Backend - testes, Checkstyle e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # o mesmo da imagem eclipse-temurin:21
          cache: maven
          # O parent vem do GitHub Packages: o servidor "github" usa o GITHUB_TOKEN.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Verify (testes + Checkstyle + JaCoCo)
        run: ./mvnw -B verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem
        run: docker build -t app:ci .

  # Check unico para a protecao de branch. "if: always()" evita que ele seja pulado quando um needs falha.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [validacoes, backend, imagem]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Resultado agregado
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Pelo menos um job nao passou."; exit 1
          fi
