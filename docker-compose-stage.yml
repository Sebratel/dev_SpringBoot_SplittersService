# Stack de STAGING (Portainer, a partir do Git: branch staging). A imagem e construida no GitHub Actions
# (workflow staging-image.yml) e publicada no GHCR; o Portainer so a baixa.
# Rede PRIVADA "gateway-backend": so o API Gateway e os 6 servicos estao nela. Os servicos NAO ficam na rede "proxy"
# (compartilhada com antifraude, dho, hub, kibana etc.): so o gateway recebe chamadas deles. Nenhum servico publica porta.
# Nome da stack = nome do repositorio em minusculas (o Compose recusa maiusculas); ver .github/scripts/validate-compose.py.
# O servico se chama pelo PAPEL (backend); o gateway o alcanca pelo alias de rede "splitters-service" (o nome "backend"
# sozinho colidiria com os demais servicos da rede gateway-backend).
name: dev_springboot_splittersservice

services:
  backend:
    image: ghcr.io/sebratel/splitters-service:staging
    pull_policy: always
    restart: unless-stopped
    mem_limit: 1g
    networks:
      backend:
        aliases:
          - splitters-service
    environment:
      - SERVER_PORT=8102
      - APP_ENV=staging
      - TZ=America/Sao_Paulo
      - JAVA_OPTS=-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError
      - ERP_DB_URL=${ERP_DB_URL}
      - ERP_DB_USER=${ERP_DB_USER}
      - ERP_DB_PASS=${ERP_DB_PASS}
      - ELLEVEN_CLIENT_ID=${ELLEVEN_CLIENT_ID:-}
      - ELLEVEN_CLIENT_SECRET=${ELLEVEN_CLIENT_SECRET:-}
      - ELLEVEN_CLIENT_SYNDATA=${ELLEVEN_CLIENT_SYNDATA:-}
      - ELLEVEN_CLIENT_GRANT_TYPE=${ELLEVEN_CLIENT_GRANT_TYPE:-}
      - ELLEVEN_CLIENT_SCOPE=${ELLEVEN_CLIENT_SCOPE:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8102'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  backend:
    name: gateway-backend
    external: true   # criada pela stack do gateway (faca o deploy do gateway primeiro)
