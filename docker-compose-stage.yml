# Stack de STAGING (Portainer, a partir do Git: branch staging).
# Rede externa "proxy": a mesma do BFF atual; os serviços se enxergam pelo nome do container.
services:
  splitters-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splitters-service-stage
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - proxy
    environment:
      - SERVER_PORT=8102
      - APP_ENV=staging
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8102'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  proxy:
    external: true
