spring:
  application:
    name: splitters-service
  jackson:
    time-zone: America/Sao_Paulo
  mvc:
    async:
      request-timeout: 600000
  datasource:
    erp:
      url: ${ERP_DB_URL}
      username: ${ERP_DB_USER}
      password: ${ERP_DB_PASS}
      driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SHOW_SQL:false}

server:
  port: ${SERVER_PORT:8102}
  tomcat:
    connection-timeout: 600000

management:
  endpoints:
    web:
      exposure:
        include: health,info

elleven:
  client-id: ${ELLEVEN_CLIENT_ID:}
  client-secret: ${ELLEVEN_CLIENT_SECRET:}
  syndata: ${ELLEVEN_CLIENT_SYNDATA:}
  grant-type: ${ELLEVEN_CLIENT_GRANT_TYPE:}
  scope: ${ELLEVEN_CLIENT_SCOPE:}
